name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build workspaces
        run: npm run build
      - name: Unit + protocol tests (turbo)
        run: npm test
      - name: CLI end-to-end tests
        run: npm run test:cli
      - name: Docker image builds
        run: docker build -t soulsketch/mcp-server:ci -f packages/mcp-server/Dockerfile .
