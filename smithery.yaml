# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
# SoulSketch MCP server - portable, user-owned AI memory packs.

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - sanctumPath
    properties:
      sanctumPath:
        type: string
        description: >-
          Absolute path to your Soul-Sanctum - the private folder/repo holding
          your 5-file memory packs. The server can only see this directory.
      tools:
        type: string
        default: all
        description: >-
          Optional tools to enable: "all", "none", or a comma list of
          observe, fingerprint, diff, continuity_record. read_pack and
          validate_pack are always on. (Normally set by the setup wizard:
          npx -y @soulsketch/mcp-server setup)
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@soulsketch/mcp-server'],
      env: {
        SOULSKETCH_ALLOWED_ROOTS: config.sanctumPath,
        ...(config.tools && config.tools !== 'all' ? { SOULSKETCH_TOOLS: config.tools } : {})
      }
    })
  exampleConfig:
    sanctumPath: /home/user/soul-sanctum
    tools: all
